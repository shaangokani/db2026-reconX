# TICKET-ADV093 / ADV094 — Prometheus alert rules
groups:
  - name: reconx-business
    rules:
      - alert: TooManyReconBreaks
        expr: recon_break_count > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Open recon breaks > 50 for 5 min"
          description: "Current breaks: {{ $value }}"

      - alert: HighApiLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_server_requests_seconds_bucket[5m])) by (le, uri)
          ) > 0.5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "P95 request latency > 500ms for 3 min on {{ $labels.uri }}"

      # TICKET-ADV142 — alerts on DLQ *count*, not lag: a fast DlqConsumer keeps
      # lag at 0 even though a message genuinely landed on the DLQ and needs
      # a human. Metric name has the fetch_manager infix on this Kafka client
      # version — kafka_consumer_records_consumed_total (no infix) doesn't exist.
      - alert: KafkaDlqMessages
        expr: sum(kafka_consumer_fetch_manager_records_consumed_total{topic="trade-events-dlq"}) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Messages in trade-events DLQ"
          description: "At least one message has been DLQ'd in the last minute. Inspect /api/v1/admin/dlq."
